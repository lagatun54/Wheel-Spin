name: Cocos Creator Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Cocos build platform
        required: true
        type: choice
        default: web-mobile
        options:
          - web-mobile
          - web-desktop
      debug:
        description: Build debug version
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.platform || 'web-mobile' }}
    runs-on: ${{ vars.COCOS_RUNNER || 'self-hosted' }}
    timeout-minutes: 45

    env:
      CREATOR_VERSION: 3.6.3
      BUILD_PLATFORM: ${{ inputs.platform || 'web-mobile' }}
      BUILD_DEBUG: ${{ inputs.debug || false }}
      BUILD_DIR: ${{ github.workspace }}/build
      COCOS_LOG_DIR: ${{ github.workspace }}/build-logs
      PAGES_DIR: ${{ github.workspace }}/github-pages
      COCOS_CREATOR_PATH: ${{ vars.COCOS_CREATOR_PATH }}
      COCOS_USE_XVFB: ${{ vars.COCOS_USE_XVFB || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Cocos Creator executable
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            "${COCOS_CREATOR_PATH}"
            "${COCOS_CREATOR_PATH}/CocosCreator"
            "${HOME}/CocosCreator/Creator/${CREATOR_VERSION}/CocosCreator"
            "${HOME}/Cocos/Creator/${CREATOR_VERSION}/CocosCreator"
            "/opt/CocosCreator/Creator/${CREATOR_VERSION}/CocosCreator"
            "/opt/Cocos/Creator/${CREATOR_VERSION}/CocosCreator"
            "/usr/local/bin/CocosCreator"
            "/usr/bin/CocosCreator"
          )

          if command -v CocosCreator >/dev/null 2>&1; then
            candidates+=("$(command -v CocosCreator)")
          fi

          for candidate in "${candidates[@]}"; do
            if [ -n "${candidate}" ] && [ -f "${candidate}" ] && [ -x "${candidate}" ]; then
              echo "COCOS_EXECUTABLE=${candidate}" >> "${GITHUB_ENV}"
              echo "Using Cocos Creator: ${candidate}"
              exit 0
            fi
          done

          {
            echo "Cocos Creator ${CREATOR_VERSION} executable was not found."
            echo "Install Cocos Creator on the Linux build runner and set repository variable COCOS_CREATOR_PATH."
            echo "Example: /opt/CocosCreator/Creator/3.6.3/CocosCreator"
          } >&2
          exit 1

      - name: Build project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${BUILD_DIR}/${BUILD_PLATFORM}"
          mkdir -p "${COCOS_LOG_DIR}"

          source_config="buildConfig_${BUILD_PLATFORM}.json"
          ci_config="buildConfig_ci.json"
          if [ ! -f "${source_config}" ]; then
            echo "Build config was not found: ${source_config}" >&2
            exit 1
          fi

          node - "${source_config}" "${ci_config}" "${BUILD_DEBUG}" "${BUILD_DIR}" "${COCOS_LOG_DIR}/cocos-build.log" <<'NODE'
          const fs = require('fs');

          const [sourceConfig, ciConfig, debug, buildPath, logDest] = process.argv.slice(2);
          const config = JSON.parse(fs.readFileSync(sourceConfig, 'utf8'));

          config.debug = debug === 'true';
          config.buildPath = buildPath;
          config.logDest = logDest;

          fs.writeFileSync(ciConfig, `${JSON.stringify(config, null, 2)}\n`);
          NODE

          build_args="configPath=${ci_config};"
          echo "Build args: ${build_args}"

          command=("${COCOS_EXECUTABLE}" --project "${GITHUB_WORKSPACE}" --build "${build_args}")
          if [ "${COCOS_USE_XVFB}" = "true" ] && command -v xvfb-run >/dev/null 2>&1; then
            command=(xvfb-run -a "${command[@]}")
          fi

          set +e
          "${command[@]}"
          status=$?
          set -e

          if [ "${status}" -ne 0 ] && [ "${status}" -ne 36 ]; then
            echo "Cocos Creator build failed with exit code ${status}" >&2
            exit "${status}"
          fi

          if [ "${status}" -eq 36 ]; then
            echo "Cocos Creator reported successful build with exit code 36."
          fi

          if [ ! -d "${BUILD_DIR}/${BUILD_PLATFORM}" ]; then
            echo "Build output directory was not found: ${BUILD_DIR}/${BUILD_PLATFORM}" >&2
            exit 1
          fi

      - name: Upload Cocos build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocos-build-logs-${{ github.sha }}
          path: build-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cocos-${{ env.BUILD_PLATFORM }}-${{ github.sha }}
          path: build/${{ env.BUILD_PLATFORM }}
          if-no-files-found: error
          retention-days: 14

      - name: Prepare GitHub Pages content
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${PAGES_DIR}"
          mkdir -p "${PAGES_DIR}"
          cp -a "${BUILD_DIR}/${BUILD_PLATFORM}/." "${PAGES_DIR}/"
          touch "${PAGES_DIR}/.nojekyll"

          if [ ! -f "${PAGES_DIR}/index.html" ]; then
            echo "GitHub Pages content must contain index.html at the root." >&2
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
