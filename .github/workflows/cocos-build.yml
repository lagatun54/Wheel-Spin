name: Cocos Creator Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Cocos build platform
        required: true
        type: choice
        default: web-mobile
        options:
          - web-mobile
          - web-desktop
      debug:
        description: Build debug version
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.platform || 'web-mobile' }}
    runs-on: ${{ vars.COCOS_RUNNER || 'self-hosted' }}
    timeout-minutes: 45

    env:
      CREATOR_VERSION: 3.6.3
      BUILD_PLATFORM: ${{ inputs.platform || 'web-mobile' }}
      BUILD_DEBUG: ${{ inputs.debug || false }}
      BUILD_DIR: ${{ github.workspace }}/build
      COCOS_LOG_DIR: ${{ github.workspace }}/build-logs
      COCOS_CREATOR_PATH: ${{ vars.COCOS_CREATOR_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Cocos Creator executable
        shell: pwsh
        run: |
          $candidates = @(
            $env:COCOS_CREATOR_PATH,
            "$env:COCOS_CREATOR_PATH/Contents/MacOS/CocosCreator",
            "$env:COCOS_CREATOR_PATH/CocosCreator.exe",
            "C:/Program Files/CocosCreator/Creator/$env:CREATOR_VERSION/CocosCreator.exe",
            "C:/Program Files/Cocos/Creator/$env:CREATOR_VERSION/CocosCreator.exe",
            "/Applications/CocosCreator/Creator/$env:CREATOR_VERSION/CocosCreator.app/Contents/MacOS/CocosCreator",
            "/Applications/Cocos/Creator/$env:CREATOR_VERSION/CocosCreator.app/Contents/MacOS/CocosCreator"
          )

          foreach ($candidate in $candidates) {
            if ($candidate -and (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              "COCOS_EXECUTABLE=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Append
              "Using Cocos Creator: $candidate"
              exit 0
            }
          }

          Write-Error @"
          Cocos Creator $env:CREATOR_VERSION executable was not found.
          Install Cocos Creator on the build runner and set repository variable COCOS_CREATOR_PATH.
          Examples:
          Windows: C:\Program Files\CocosCreator\Creator\3.6.3\CocosCreator.exe
          macOS: /Applications/CocosCreator/Creator/3.6.3/CocosCreator.app/Contents/MacOS/CocosCreator
          "@
          exit 1

      - name: Build project
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "$env:BUILD_DIR/$env:BUILD_PLATFORM" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:COCOS_LOG_DIR | Out-Null

          $sourceConfig = "buildConfig_$env:BUILD_PLATFORM.json"
          $ciConfig = "buildConfig_ci.json"
          if (-not (Test-Path -LiteralPath $sourceConfig -PathType Leaf)) {
            Write-Error "Build config was not found: $sourceConfig"
            exit 1
          }

          $logPath = Join-Path $env:COCOS_LOG_DIR "cocos-build.log"
          $config = Get-Content -Raw -LiteralPath $sourceConfig | ConvertFrom-Json
          $config.debug = [System.Convert]::ToBoolean($env:BUILD_DEBUG)
          $config.buildPath = $env:BUILD_DIR
          $config.logDest = $logPath
          $config | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $ciConfig -Encoding UTF8

          $buildArgs = "configPath=$ciConfig;"
          "Build args: $buildArgs"

          & $env:COCOS_EXECUTABLE --project $env:GITHUB_WORKSPACE --build $buildArgs
          $status = $LASTEXITCODE

          if ($status -ne 0 -and $status -ne 36) {
            Write-Error "Cocos Creator build failed with exit code $status"
            exit $status
          }

          if ($status -eq 36) {
            "Cocos Creator reported successful build with exit code 36."
          }

          if (-not (Test-Path -LiteralPath "$env:BUILD_DIR/$env:BUILD_PLATFORM" -PathType Container)) {
            Write-Error "Build output directory was not found: $env:BUILD_DIR/$env:BUILD_PLATFORM"
            exit 1
          }

      - name: Upload Cocos build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocos-build-logs-${{ github.sha }}
          path: build-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cocos-${{ env.BUILD_PLATFORM }}-${{ github.sha }}
          path: build/${{ env.BUILD_PLATFORM }}
          if-no-files-found: error
          retention-days: 14
